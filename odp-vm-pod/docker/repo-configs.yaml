# ODP Repository Configuration
# Define where to download ODP packages from during image build

# Production/Latest Releases
production:
  odp_3_3_6_3:
    odp_repo_url: "https://mirror.odp.acceldata.dev/ODP/centos/3.3.6.3-1/"
    ambari_repo_url: "https://mirror.odp.acceldata.dev/AMBARI/centos/2.7.6.0-1/"
