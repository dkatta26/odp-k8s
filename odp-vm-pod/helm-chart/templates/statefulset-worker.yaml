apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.clusterName }}-worker
  labels:
    app: odp-cluster
    cluster: {{ .Values.clusterName }}
    role: worker
spec:
  serviceName: {{ .Values.clusterName }}-headless
  replicas: {{ .Values.nodes.worker.count }}
  selector:
    matchLabels:
      app: odp-cluster
      cluster: {{ .Values.clusterName }}
      role: worker
  template:
    metadata:
      labels:
        app: odp-cluster
        cluster: {{ .Values.clusterName }}
        role: worker
    spec:
      # Init container to install ODP packages at startup
      initContainers:
      - name: install-odp
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command:
        - /bin/bash
        - -c
        - |
          #!/bin/bash
          set -e

          echo "=== Starting ODP Installation ==="
          echo "ODP Version: {{ .Values.odp.version }}"

          # Check if already installed (for pod restarts)
          if [ -f /opt/odp/.installed ]; then
            echo "ODP already installed, skipping..."
            exit 0
          fi

          # Setup ODP repository
          cat > /etc/yum.repos.d/odp.repo <<'EOF'
          [ODP]
          name=ODP {{ .Values.odp.version }}
          baseurl={{ .Values.odp.repositories.odp }}
          gpgcheck=0
          enabled=1
          priority=1

          [AMBARI]
          name=Ambari
          baseurl={{ .Values.odp.repositories.ambari }}
          gpgcheck=0
          enabled=1
          priority=1
          EOF

          # Install required system packages
          echo "Installing system packages..."
          yum install -y \
            systemd \
            openssh-server \
            wget curl tar gzip \
            net-tools bind-utils \
            which sudo rsync \
            python3 python3-pip

          # Install Java
          echo "Installing Java {{ .Values.odp.java.version }}..."
          yum install -y {{ .Values.odp.java.package }}

          # Install ODP components (worker role)
          echo "Installing ODP components..."
          yum install -y \
            ambari-agent \
            hadoop \
            hadoop-hdfs-datanode \
            hadoop-yarn-nodemanager \
            hadoop-mapreduce \
            hbase-regionserver \
            kafka \
            spark2

          # Create directories
          echo "Creating directories..."
          mkdir -p \
            /hadoop/hdfs/datanode \
            /hadoop/yarn/local \
            /hadoop/yarn/logs \
            /var/log/hadoop \
            /var/log/ambari-agent \
            /var/log/hbase \
            /var/log/kafka

          # Set permissions
          chmod -R 755 /hadoop /var/log

          # Mark as installed
          mkdir -p /opt/odp
          echo "{{ .Values.odp.version }}" > /opt/odp/.installed
          date >> /opt/odp/.installed

          echo "=== ODP Installation Completed ==="

        volumeMounts:
        - name: data
          mountPath: /hadoop
        - name: logs
          mountPath: /var/log
        - name: odp-install-marker
          mountPath: /opt/odp

      # Main container
      containers:
      - name: odp-node
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        # Run systemd as init system
        command: ["/usr/sbin/init"]

        env:
        - name: NODE_TYPE
          value: "worker"
        - name: CLUSTER_NAME
          value: {{ .Values.clusterName }}
        - name: ODP_VERSION
          value: {{ .Values.odp.version }}

        resources:
          {{- toYaml .Values.nodes.worker.resources | nindent 10 }}

        ports:
        - name: ssh
          containerPort: 22
        - name: datanode-web
          containerPort: 9864
        - name: datanode-data
          containerPort: 9866
        - name: nodemanager-web
          containerPort: 8042
        - name: hbase-region
          containerPort: 16020
        - name: kafka
          containerPort: 9092

        volumeMounts:
        - name: data
          mountPath: /hadoop
        - name: logs
          mountPath: /var/log
        - name: odp-install-marker
          mountPath: /opt/odp
        - name: systemd-cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true

        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN

      volumes:
      - name: systemd-cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: odp-install-marker
        emptyDir: {}

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.nodes.worker.storage.data.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.nodes.worker.storage.data.size }}

  - metadata:
      name: logs
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.nodes.worker.storage.logs.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.nodes.worker.storage.logs.size }}
