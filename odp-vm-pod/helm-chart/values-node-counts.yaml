# Node Count Examples - Matching Jenkins Pipeline Options
# Similar to your current NODE_COUNT parameter: 1,2,3,3_HA,4,4_HA,5,6,7,8,9,10

# Common configuration for all examples
common: &common
  image:
    repository: "acceldata/odp-vm-node"
    tag: "rhel9-odp3.3.6.3-jdk11"

  # Default resources (adjust as needed)
  defaultResources: &defaultResources
    requests:
      memory: "30Gi"
      cpu: "6"
    limits:
      memory: "32Gi"
      cpu: "8"

# =========================================================================
# 1 Node - Everything on one pod (minimal testing)
# =========================================================================
topology-1-node:
  clusterName: "cluster-1node"

  nodes:
    master:
      count: 1
      resources: *defaultResources
      storage:
        size: "200Gi"  # Larger since it's the only node

    worker:
      count: 0  # No separate workers

# =========================================================================
# 2 Nodes - 1 master + 1 worker
# =========================================================================
topology-2-nodes:
  clusterName: "cluster-2nodes"

  nodes:
    master:
      count: 1
      resources: *defaultResources
      storage:
        size: "100Gi"

    worker:
      count: 1
      resources: *defaultResources
      storage:
        size: "500Gi"

# =========================================================================
# 3 Nodes - 1 master + 2 workers
# =========================================================================
topology-3-nodes:
  clusterName: "cluster-3nodes"

  nodes:
    master:
      count: 1
      resources: *defaultResources
      storage:
        size: "100Gi"

    worker:
      count: 2
      resources: *defaultResources
      storage:
        size: "500Gi"

# =========================================================================
# 3 Nodes HA - 2 masters + 1 worker (High Availability)
# =========================================================================
topology-3-nodes-ha:
  clusterName: "cluster-3nodes-ha"

  nodes:
    master:
      count: 2  # HA configuration
      resources: *defaultResources
      storage:
        size: "150Gi"

    worker:
      count: 1
      resources: *defaultResources
      storage:
        size: "500Gi"

# =========================================================================
# 4 Nodes - 1 master + 3 workers
