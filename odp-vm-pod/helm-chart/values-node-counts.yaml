# =========================================================================
# CUSTOM - Set any number you want
# =========================================================================
topology-custom:
  clusterName: "cluster-custom"

  nodes:
    master:
      count: 2  # Change this
      resources:
        requests:
          memory: "30Gi"  # Change this
          cpu: "6"        # Change this
      storage:
        size: "100Gi"     # Change this

    worker:
      count: 5  # Change this
      resources:
        requests:
          memory: "30Gi"
          cpu: "6"
      storage:
        size: "500Gi"
