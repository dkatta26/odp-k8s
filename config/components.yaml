# Component Definitions
# This file defines all available components and their build configurations

components:
  # P1 Components - Built from separate repositories
  hbase-p1:
    name: hbase-p1
    description: "Apache HBase P1 - Required by Hadoop"
    is_p1: true
    github_repo: "git@github.com:acceldata-io/hbase.git"
    build_command: "mvn clean deploy assembly:single -Prelease -DskipTests -Dhadoop.profile=3.0 -pl org.apache.hbase:hbase-common,org.apache.hbase:hbase-client,org.apache.hbase:hbase-server,org.apache.hbase:hbase-testing-util -am"
    dependencies: 
      - zookeeper
      - hadoop-p1

  hadoop-p1:
    name: hadoop-p1
    description: "Apache Hadoop P1 - Required by HBase"
    is_p1: true
    github_repo: "git@github.com:acceldata-io/hadoop.git"
    build_command: "mvn clean deploy -pl 'hadoop-common-project/hadoop-common,hadoop-common-project/hadoop-minikdc,hadoop-mapreduce-project/hadoop-mapreduce-client/hadoop-mapreduce-client-core,hadoop-minicluster,hadoop-tools/hadoop-distcp' -am -Drequire.snappy=true -Dbundle.snappy=true -Dsnappy.prefix=x -Dsnappy.lib=/usr/lib64 -Drequire.zstd=true -Drequire.pmdk=true -Drequire.fuse=true -Dpmdk.lib=/usr/lib64 -Drequire.openssl=true -Dmaven.javadoc.skip=true -Dhbase.profile=2.0 -Dcontainer-executor.additional_cflags='-std=c99' -DskipTests -DskipITs -Pdist,native,src -Dtar"
    dependencies:
      - zookeeper

  hive-p1:
    name: hive-p1
    description: "Apache Hive P1 - Distributed data warehouse"
    is_p1: true
    github_repo: "git@github.com:acceldata-io/hive.git"
    build_command: "mvn clean deploy -Dtar -Pdist -Pgcs -Paws -Pazure -Psources -DskipTests -Dmaven.javadoc.skip=true -DcreateChecksum=true -PcleanUICache -Pvisualize -Ptools -Dallow.roobuild -pl org.apache.hive:hive-common,org.apache.hive:hive-service,org.apache.hive:hive-exec,org.apache.hive:hive-metastore,org.apache.hive:hive-jdbc,org.apache.hive:hive-storage-api,org.apache.hive:hive-cli,org.apache.hive.hcatalog:hive-hcatalog-core,org.apache.hive.hcatalog:hive-webhcat-java-client,org.apache.hive:hive-beeline,org.apache.hive:hive-service-rpc,org.apache.hive:hive-streaming,org.apache.hive:hive-llap-ext-client,org.apache.hive.hcatalog:hive-hcatalog-server-extensions,org.apache.hive.hcatalog:hive-hcatalog-pig-adapter,org.apache.hive:hive-classification,org.apache.hive:hive-standalone-metastore-common,org.apache.hive:hive-standalone-metastore-server,org.apache.hive.shims:hive-shims-common,org.apache.hive:hive-llap-server,org.apache.hive:hive-serde -am"
    dependencies:
      - hadoop-p1

  ranger-p1:
    name: ranger-p1
    description: "Apache Ranger P1 - Distributed security"
    is_p1: true
    github_repo: "git@github.com:acceldata-io/ranger.git"
    build_command: "mvn clean compile package install deploy -Dmaven.test.skip=true -DskipTests -DskipJSTests -Pall,ranger-jdk11,linux-pam -pl org.apache.ranger:ranger-plugins-common,org.apache.ranger:ranger-plugin-classloader,org.apache.ranger:ranger-plugins-audit,org.apache.ranger:ranger-intg -am"
    dependencies:
      - hadoop
      - zookeeper
      - kafka
      - kafka3
      - hbase
      - hive-p1
      - knox
      - tez
      - sqoop
    

  # Standard Components - Built from odp-bigtop repository
